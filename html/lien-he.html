<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ - Mobile Store</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="pt-5 mt-4">

    <nav class="navbar navbar-expand-lg custom-navbar fixed-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="../index.html">
                <i class="fa-solid fa-mobile-button me-2 brand-icon"></i>
                <span class="brand-text">Mobile Store</span>
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Trang chủ</a></li>
                    <li class="nav-item"><a class="nav-link" href="san-pham.html">Sản phẩm</a></li>
                    <li class="nav-item"><a class="nav-link" href="gioi-thieu.html">Giới thiệu</a></li>
                    <li class="nav-item"><a class="nav-link active" href="lien-he.html">Liên hệ</a></li>
                    
                    <li class="nav-item ms-lg-3 mt-3 mt-lg-0">
                        <a class="nav-link cart-btn text-white d-flex align-items-center" href="gio-hang.html">
                            <i class="fa-solid fa-shopping-cart me-2"></i> Giỏ hàng 
                            <span id="cart-count" class="badge bg-white text-orange rounded-pill ms-2">0</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="mb-4">Liên hệ với chúng tôi</h2>
        
        <div class="p-4 bg-white border rounded shadow-sm" style="max-width: 600px;">
            <form>
                <div class="mb-3">
                    <label class="form-label fw-bold">Họ và tên</label>
                    <input type="text" class="form-control" placeholder="Nhập tên của bạn">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Nội dung</label>
                    <textarea class="form-control" rows="4" placeholder="Nhập nội dung cần hỗ trợ"></textarea>
                </div>
                <button type="button" class="btn btn-primary px-4" onclick="alert('Cảm ơn bạn, chúng tôi đã nhận được tin nhắn!')">Gửi tin nhắn</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
